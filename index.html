<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graduate Career Foundations – E-Learning Demo | Resources KE Ltd</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@600;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.55 Lato,Arial,sans-serif;background:#FAFAFA;color:#0D1A2D}
h1,h2,h3,button,.m{font-family:Montserrat,Arial,sans-serif}h2{font-size:28px;margin:2px 0 8px;line-height:1.2}h3{margin:0 0 4px;font-size:17px}p{margin:0 0 10px}
:focus-visible{outline:3px solid #0F4C5C;outline-offset:2px}
#app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:#0D1A2D;color:#FAFAFA;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.br{font:700 17px Montserrat,Arial;padding:0 8px 14px;border-bottom:3px solid #C9A44A;margin-bottom:10px}
aside button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;color:#D9D9D9;padding:8px;border-radius:6px;font:14px Lato,Arial;min-height:38px;cursor:pointer}
aside button.on{background:#0F4C5C;color:#fff;font-weight:700}aside button:disabled{opacity:.45;cursor:not-allowed}aside b{width:18px;flex:none}
main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 32px;background:#fff;border-bottom:1px solid #D9D9D9;gap:10px;flex-wrap:wrap;font-size:14px}
.pb{height:5px;background:#D9D9D9}.pb i{display:block;height:5px;background:#C9A44A;transition:width .3s}
#stage{flex:1;padding:32px;max-width:920px;width:100%}.k{color:#0F4C5C;font-size:13px;font-weight:700;margin:0}
.nv{display:flex;justify-content:space-between;padding:14px 32px;border-top:1px solid #D9D9D9;background:#fff;position:sticky;bottom:0}
.btn{min-height:44px;padding:0 24px;border-radius:8px;border:2px solid #0D1A2D;background:#fff;color:#0D1A2D;font-weight:600;font-size:15px;cursor:pointer}
.btn.p{background:#0D1A2D;color:#FAFAFA}.btn.g{background:#C9A44A;border-color:#C9A44A}.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:#fff;border:2px solid #D9D9D9;border-radius:10px;padding:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:block;width:100%;text-align:left;min-height:48px;padding:10px 16px;margin:0 0 10px;border:2px solid #0D1A2D;border-radius:8px;background:#fff;font:16px Lato,Arial;color:#0D1A2D;cursor:pointer}
.opt.sel{background:#0D1A2D;color:#FAFAFA}.opt.ok{background:#E3F1EC;border-color:#0F4C5C}.opt.no{background:#F8E6E3;border-color:#8A2D20}
.chip{min-height:44px;padding:0 16px;border:2px solid #0D1A2D;border-radius:22px;background:#fff;font:16px Lato,Arial;color:#0D1A2D;cursor:grab}
.zone{min-height:130px;border:2px dashed #3D4756;border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:#fff}
.fb{border-left:5px solid #C9A44A;background:#fff;padding:12px 16px;margin-top:14px;border-radius:0 8px 8px 0}
.hero{background:linear-gradient(135deg,#0D1A2D,#0F4C5C);color:#FAFAFA;border-radius:12px;padding:36px}.hero h1{font-size:38px;line-height:1.12;margin:0 0 10px}.hero p{color:#D9D9D9}
.bar{height:22px;background:#D9D9D9;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#0F4C5C}.bar.me i{background:#C9A44A}
input,textarea{width:100%;font:16px Lato,Arial;padding:10px 12px;border:2px solid #0D1A2D;border-radius:8px;background:#fff;color:#0D1A2D}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}.sm{font-size:14px;color:#3D4756}
#pr{display:none;padding:30px}@media print{#app{display:none}#pr{display:block}}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{display:none}.g2{grid-template-columns:1fr}#stage{padding:20px}.top,.nv{padding:12px 20px}.hero h1{font-size:28px}}
</style></head><body>
<div id="app"><aside><div class="br">Resources KE Ltd</div><div id="side"></div></aside>
<main><div class="top"><span class="m"><b>Graduate Career Foundations</b> (demo module)</span><span id="who"></span></div>
<div class="pb"><i id="pbar"></i></div><section id="stage" aria-live="polite"></section>
<div class="nv"><button class="btn" id="bk" onclick="go(-1)">Back</button><button class="btn p" id="nx" onclick="go(1)">Continue</button></div></main></div>
<div id="pr"></div>
<script>
const $=i=>document.getElementById(i),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={i:0,max:0,poll:null,rev:{},t:{},v:[],vr:'',idt:'',st:null,m:{},sc:null,pl:{},q:{},qs:null,cm:'',name:'Alex Morgan'};
const TK=['Solving problems','Working with people','Analysing information','Organising tasks','Creative thinking','Presenting ideas'];
const VA=['Growth','Stability','Creativity','Connection','Purpose','Learning'];
const FE=[['Identity','You may not feel like a professional yet. That is a normal part of moving from student to colleague.'],['Confidence','Everything is new, so self-doubt is common. Confidence grows with small, repeated wins.'],['Expectations','Real work rarely matches the picture in your head. Adjusting expectations is a skill.'],['Experience','You are learning on the job while building skills. Nobody expects you to know it all.']];
const PO=['Very confident','Somewhat confident','Unsure','Not confident yet'],PS=[18,41,29,12];
const ST=[['Analytical','break,pattern,data,analy,logic,step,root','You break problems into parts and rely on evidence. Roles in data, planning or operations may suit you.'],
['Creative','idea,brainstorm,creative,new,different,design,imagin','You look for fresh angles. Design, marketing or content roles often reward this style.'],
['Collaborative','team,talk,ask,colleague,people,together,discuss','You solve problems with others. Collaboration is an early leadership behaviour.'],
['Practical','try,test,hands,practi,quick,doing,action,learn by','You learn by doing. Operations, customer service and project support roles fit well.'],
['Reflective','think,reflect,consider,plan,careful,review,impact','You pause and weigh options. Advisory, coaching and HR roles value this.']];
const SO=[['Quietly finish your own part and say nothing.','Reliable, but you miss a chance to support a teammate.',0],['Offer your teammate help, and tell your manager you are tackling it together.','Best choice. It shows supporting others and clear communication.',1],['Tell your manager your teammate is behind.','Transparent, but speak to your teammate first. It builds trust.',0]];
const Q=[['What is a personal value?',['A task that drains you','A principle that guides your decisions','A job title'],1],['Early leadership starts with…',['A promotion','Behaviour, not job title','Seniority'],1],['Which is a good networking question?',['Can you get me a job?','How did you get into your role?','What is your salary?'],1]];
const set=(o,k,v)=>{S[o][k]=v;nav()},sv=(k,v)=>{S[k]=v;nav()};
const ta=(k,ph,r)=>`<textarea rows="${r||3}" placeholder="${ph}" oninput="sv('${k}',this.value)">${E(S[k])}</textarea>`;
const fi=(o,k,l)=>`<label for="${o}${k}">${l}</label><input id="${o}${k}" value="${E(S[o][k])}" oninput="set('${o}','${k}',this.value)">`;
const bar=(l,p,me)=>`<div class="sm">${l} · ${p}%${me?' (your answer)':''}</div><div class="bar${me?' me':''}"><i style="width:${p}%"></i></div>`;
const SC=[
{t:'Welcome',m:1,r:()=>`<div class="hero"><p class="m" style="color:#C9A44A;margin:0 0 8px">Resources KE Ltd</p><h1>Build clarity, confidence and direction</h1><p>A self-paced module for graduates and early-career professionals. Learn at your own pace, answer short activities, and earn a certificate.</p><p class="sm" style="color:#D9D9D9">Prototype with sample content. Tracking and statistics are simulated.</p></div>`,ok:()=>1},
{t:'What you will learn',m:1,r:()=>`<div class="card"><ul style="margin:0;padding-left:20px"><li>Understand the move from student to professional</li><li>Identify your strengths and values</li><li>Describe your professional identity</li><li>Build a simple Career Map</li><li>Recognise early leadership behaviours</li><li>Create a 30–60 day action plan</li></ul></div><p class="sm" style="margin-top:12px">Estimated time: about 40 minutes. Your progress is tracked in the left menu.</p>`,ok:()=>1},
{t:'The transition moment',m:3,r:()=>`<p>Starting work means less structure and more self-direction. How confident do you feel about your career direction?</p>`+PO.map((o,i)=>`<button class="opt${S.poll===i?' sel':''}" onclick="S.poll=${i};R()">${o}</button>`).join('')+(S.poll!=null?`<div class="fb"><h3>How others answered</h3>${PO.map((o,i)=>bar(o,PS[i],i===S.poll)).join('')}<p class="sm" style="margin-top:8px">Sample figures for demonstration. In the full build this can connect to a live survey source.</p></div>`:''),ok:()=>S.poll!=null},
{t:'Common early-career feelings',m:5,r:()=>`<p>Select each card to reveal what it means. (${Object.keys(S.rev).length} of 4 opened)</p><div class="g2">`+FE.map((f,i)=>`<button class="opt${S.rev[i]?' ok':''}" style="min-height:130px" onclick="S.rev[${i}]=1;R()"><b class="m">${f[0]}</b><br>${S.rev[i]?f[1]:'Select to reveal'}</button>`).join('')+`</div>`,ok:()=>Object.keys(S.rev).length==4},
{t:'Strengths snapshot',m:5,r:()=>{const L=z=>TK.map((t,i)=>S.t[t]==z?`<button class="chip" draggable="true" ondragstart="event.dataTransfer.setData('t',${i})" onclick="cy(${i})">${t}</button>`:'').join(''),e=TK.filter(t=>S.t[t]=='e'),d=TK.filter(t=>S.t[t]=='d');
return `<p>Drag each task into a column. On a phone or keyboard, select a task to move it.</p><div class="zone" style="min-height:70px;margin-bottom:12px" ondragover="event.preventDefault()" ondrop="dr(event,0)"><span class="sm">Tasks to sort</span>${L(undefined)}</div><div class="g2"><div><h3>Energising</h3><div class="zone" ondragover="event.preventDefault()" ondrop="dr(event,'e')">${L('e')}</div></div><div><h3>Draining</h3><div class="zone" ondragover="event.preventDefault()" ondrop="dr(event,'d')">${L('d')}</div></div></div>`+(e.length+d.length==6?`<div class="fb"><h3>Your strengths summary</h3><p><b>Energised by:</b> ${e.join(', ')||'none selected'}.</p><p><b>Drained by:</b> ${d.join(', ')||'none selected'}.</p><p>Look for roles and projects with more of what energises you, and plan support for what drains you.</p></div>`:'')},ok:()=>TK.every(t=>S.t[t])},
{t:'Values exploration',m:4,r:()=>`<p>Choose your top 3 values. (${S.v.length} of 3 selected)</p><div class="g2" style="grid-template-columns:repeat(3,1fr)">`+VA.map(v=>`<button class="opt${S.v.includes(v)?' sel':''}" aria-pressed="${S.v.includes(v)}" onclick="tv('${v}')">${v}</button>`).join('')+`</div><label for="vr">Why do these values matter to you?</label>${ta('vr','Write your reflection here').replace('<textarea','<textarea id="vr"')}<div class="fb">Values act as decision filters. They help you choose roles, teams and goals that feel right.</div>`,ok:()=>S.v.length==3&&S.vr.trim()},
{t:'Professional identity',m:4,r:()=>`<p>Your identity is how you think and solve problems, not your job title. Describe how you approach a problem.</p>${ta('idt','For example: I talk it through with my team, then try a quick test.',4)}<p style="margin-top:10px"><button class="btn p" onclick="an()">Analyse my answer</button></p>`+(S.st!=null&&S.st>=0?`<div class="fb"><h3>${ST[S.st][0]} approach</h3><p>${ST[S.st][2]}</p></div>`:S.st===-1?`<div class="fb">No clear style detected. Try describing the first steps you take on a problem.</div>`:''),ok:()=>S.st!=null&&S.st>=0},
{t:'Build your Career Map',m:6,r:()=>`<div class="g2"><div class="card"><h3>Now</h3><p class="sm">Where you are today</p>${fi('m','now','Current situation')}</div><div class="card"><h3>Next</h3><p class="sm">Your next 6–12 months</p>${fi('m','roles','Possible roles')}${fi('m','skills','Skills to build')}</div></div><div class="card" style="margin-top:14px"><h3>Future</h3>${fi('m','dir','Long-term direction')}${fi('m','ppl','People who can help')}</div><p style="margin-top:12px"><button class="btn g" onclick="pdMap()">Download Career Map (PDF)</button></p>`,ok:()=>(S.m.dir||'').trim()},
{t:'Early leadership behaviours',m:5,r:()=>`<p><b>Scenario:</b> You are on a small project with two colleagues. The deadline is tomorrow. A teammate is struggling with their part but has not asked for help, and your manager has not noticed. What do you do?</p>`+SO.map((o,i)=>`<button class="opt${S.sc===i?(o[2]?' ok':' no'):''}" onclick="S.sc=${i};R()">${o[0]}</button>`).join('')+(S.sc!=null?`<div class="fb"><b>Feedback:</b> ${SO[S.sc][1]}</div>`:''),ok:()=>S.sc!=null},
{t:'Your 30–60 day plan',m:5,r:()=>`<div class="g2"><div>${fi('pl','a1','Action 1')}${fi('pl','a2','Action 2')}${fi('pl','a3','Action 3')}${fi('pl','h','One habit')}</div><div style="border-left:4px solid #C9A44A;padding-left:20px">${fi('pl','w2','Week 2 milestone')}${fi('pl','w4','Week 4 milestone')}${fi('pl','w6','Week 6 milestone')}</div></div><p style="margin-top:14px"><button class="btn g" onclick="pdPlan()">Download plan summary (PDF)</button></p>`,ok:()=>(S.pl.a1||'').trim()},
{t:'Knowledge check',m:4,r:()=>Q.map((q,qi)=>`<div class="card" style="margin-bottom:12px"><h3>${qi+1}. ${q[0]}</h3>`+q[1].map((o,oi)=>`<button class="opt${S.q[qi]===oi?' sel':''}" style="margin:6px 0 0" onclick="S.q[${qi}]=${oi};S.qs=null;R()">${o}</button>`).join('')+`</div>`).join('')+`<button class="btn p" onclick="ck()" ${Object.keys(S.q).length<3?'disabled':''}>Check answers</button>`+(S.qs!=null?`<div class="fb"><b>Score: ${S.qs} of 3.</b> ${S.qs>=2?'Passed. Continue to finish.':'You need 2 correct to pass. Change an answer and check again.'}</div>`:''),ok:()=>S.qs!=null&&S.qs>=2},
{t:'Closing reflection',m:2,r:()=>`<div class="fb" style="margin:0 0 14px"><i>Small steps, taken consistently, build direction.</i></div><label for="cm">What is one thing you will commit to this month?</label>${ta('cm','I will…').replace('<textarea','<textarea id="cm"')}`,ok:()=>S.cm.trim()},
{t:'Completion and certificate',m:1,r:()=>`<div class="hero" style="text-align:center"><h1>Congratulations</h1><p>You have completed the module. Download your certificate below.</p><p><span class="m" style="background:#C9A44A;color:#0D1A2D;padding:4px 12px;border-radius:12px;font-size:13px">Completed · Passed · ${S.qs}/3</span></p></div><div class="card" style="margin-top:14px"><label for="nm" style="margin-top:0">Name on certificate (sample learner)</label><input id="nm" value="${E(S.name)}" oninput="S.name=this.value"><p class="sm" style="margin-top:10px">LMS status (simulated): completion = completed, success = passed, score = ${Math.round(S.qs/3*100)}%. The full build exports this as SCORM/xAPI.</p><button class="btn g" onclick="pdCert()">Download certificate (PDF)</button> <button class="btn" onclick="S.i=0;R()">Return to dashboard</button></div>`,ok:()=>1}];
function R(){const s=SC[S.i];$('stage').innerHTML=`<p class="k">SCREEN ${S.i+1} OF ${SC.length} · ${s.m} MIN</p><h2>${s.t}</h2>`+s.r();$('side').innerHTML=SC.map((x,i)=>`<button class="${i==S.i?'on':''}" ${i>S.max?'disabled':''} onclick="S.i=${i};R()"><b>${i<S.max?'✓':i+1}</b>${x.t}</button>`).join('');$('pbar').style.width=Math.round(S.max/(SC.length-1)*100)+'%';$('who').textContent='Learner: '+S.name+' · Sample cohort';nav();scrollTo(0,0)}
function nav(){$('bk').disabled=S.i==0;$('nx').disabled=!SC[S.i].ok();$('nx').style.visibility=S.i==SC.length-1?'hidden':'visible'}
function go(d){if(d>0&&!SC[S.i].ok())return;S.i+=d;S.max=Math.max(S.max,S.i);R()}
function cy(i){const t=TK[i],n={undefined:'e',e:'d',d:undefined}[S.t[t]];if(n)S.t[t]=n;else delete S.t[t];R()}
function dr(ev,z){const t=TK[ev.dataTransfer.getData('t')];if(!t)return;if(z)S.t[t]=z;else delete S.t[t];R()}
function tv(v){const k=S.v.indexOf(v);if(k>=0)S.v.splice(k,1);else if(S.v.length<3)S.v.push(v);R()}
function an(){const x=S.idt.toLowerCase();let b=-1,bs=0;ST.forEach((s,i)=>{const n=s[1].split(',').filter(w=>x.includes(w)).length;if(n>bs){bs=n;b=i}});S.st=bs?b:-1;R()}
function ck(){S.qs=Q.filter((q,i)=>S.q[i]===q[2]).length;R()}
const pd=h=>{$('pr').innerHTML='<div style="font-family:Lato,Arial;color:#0D1A2D">'+h+'</div>';print()};
const li=(a)=>a.map(([l,v])=>`<p><b>${l}:</b> ${E(v)||'—'}</p>`).join('');
const pdMap=()=>pd(`<h1>My Career Map</h1><p>Resources KE Ltd · ${E(S.name)}</p>`+li([['Now',S.m.now],['Possible roles',S.m.roles],['Skills to build',S.m.skills],['Long-term direction',S.m.dir],['People who can help',S.m.ppl]]));
const pdPlan=()=>pd(`<h1>My 30–60 Day Plan</h1><p>Resources KE Ltd · ${E(S.name)}</p>`+li([['Action 1',S.pl.a1],['Action 2',S.pl.a2],['Action 3',S.pl.a3],['Habit',S.pl.h],['Week 2',S.pl.w2],['Week 4',S.pl.w4],['Week 6',S.pl.w6]]));
const pdCert=()=>pd(`<div style="border:8px double #C9A44A;padding:60px 30px;text-align:center"><p style="font:700 18px Montserrat,Arial;color:#0F4C5C">Resources KE Ltd</p><h1 style="font:700 36px Montserrat,Arial">Certificate of Completion</h1><p>This certifies that</p><h2 style="font:700 32px Montserrat,Arial">${E(S.name)}</h2><p>has completed the Graduate Career Foundations demo module</p><p>Score ${S.qs}/3 · ${new Date().toLocaleDateString('en-GB')}</p></div>`);
R();
</script></body></html>
